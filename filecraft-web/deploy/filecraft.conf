# ---------- FileCraft Web（独立新项目，不动 vibenav 的任何配置） ----------
# 安装位置：/etc/nginx/conf.d/filecraft.conf
# 服务器 nginx 1.24：http2 用 listen 参数写法（不支持 1.25+ 的 "http2 on;" 指令）

# ---------- HTTP：跳 HTTPS + 证书续期 ----------
server {
    listen      80;
    listen      [::]:80;
    server_name filecraft.vibenav.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name filecraft.vibenav.xyz;

    # 2026-09-19 全新签发（服务器上此前无任何证书），certbot 自动续期
    ssl_certificate     /etc/letsencrypt/live/filecraft.vibenav.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/filecraft.vibenav.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;

    # 上传文档用；单个文件上限 40MB（应用侧另有校验），留出余量
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3100;   # filecraft-web 独立端口
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;            # AI 总结/问答耗时较长
        proxy_send_timeout 300s;
        # SSE（AI 总结进度流）：X-Accel-Buffering 已由应用按响应关闭，
        # 这里再兜底关掉缓冲，保证进度实时推送
        proxy_buffering off;
    }
}

# ⚠ 运维备注（2026-09-19）：
# vibenav.xyz 未备案，阿里云边缘拦截外部所有 80 端口流量（返回 Beaver 403），
# 外部访问 http:// 会看到拦截页；https://filecraft.vibenav.xyz 完全正常。
# 影响：Let's Encrypt 的 HTTP-01 续期约 2026-11-18 起会失败，
# 到期前需改用 DNS-01 验证（certbot + aliyun dns 凭据）或完成 ICP 备案。
